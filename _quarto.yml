project:
  type: book
  output-dir: _book
  resources:
    - hojear.html
    - imagenes/**

lang: es

book:
  title: "Código Entrópico"
  subtitle: "La evolución del desarrollo de software frente al ojo de la IA"
  author: "Diego Torrez"
  date: today
  date-format: "MMMM YYYY"
  description: "Proyecto Semestral de Producción Intelectual — Dirección y Liderazgo Creativo (UNIFRANZ). Área: Desarrollo de Software."
  search: true
  cover-image: portada/portada.svg
  cover-image-alt: "Portada: el cuaderno de tapas azules de Doña Rosa, con la etiqueta CÓDIGO ENTRÓPICO; una rotura deja ver la lista del pedido que se vuelve código y ruido, y un ojo que mira desde adentro"
  output-file: codigo-entropico
  sidebar:
    tools:
      - icon: book-half
        href: hojear.html
        text: "Hojear el libro impreso"
      - icon: file-earmark-pdf
        href: codigo-entropico.pdf
        text: "Descargar PDF"
  chapters:
    - index.qmd
    - introduccion.qmd
    - ciclo-entropico.qmd
    - part: partes/parte1.qmd
      chapters:
        - capitulos/01-pensar-antes-de-programar.qmd
        - capitulos/02-el-primer-lenguaje.qmd
        - capitulos/03-disenar-para-durar.qmd
        - capitulos/04-git-y-trabajo-en-equipo.qmd
        - capitulos/05-del-codigo-a-produccion.qmd
    - part: partes/parte2.qmd
      chapters:
        - capitulos/06-como-piensa-un-modelo-de-lenguaje.qmd
        - capitulos/07-comunicarse-con-la-maquina.qmd
        - capitulos/08-revisar-lo-que-no-escribiste.qmd
    - part: partes/parte3.qmd
      chapters:
        - capitulos/09-la-ia-dentro-de-tus-sistemas.qmd
        - capitulos/10-cuando-la-ia-actua.qmd
    - part: partes/parte4.qmd
      chapters:
        - capitulos/11-bolivia-frente-a-la-ia.qmd
        - capitulos/12-custodia.qmd
    - epilogo.qmd
    - referencias.qmd

bibliography: references.bib
crossref:
  chapters: true
  lst-prefix: "Código"
  lst-title: "Código"

filters:
  - estilos/filtros/libro.lua
  - quarto
  - estilos/filtros/libro-post.lua

mermaid:
  theme: neutral

format:
  html:
    theme: [cosmo, estilos/tema.scss]   # identidad brutalista: un solo tema claro
    css: estilos/estilos.css
    toc: true
    toc-title: "En este capítulo"
    number-sections: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
  typst:                                  # versión impresa (PDF) — diseño en estilos/typst/
    keep-typ: false
    toc: false                            # el índice lo dibuja la plantilla
    number-sections: true
    fig-width: 4.8
    bibliographystyle: apa
    template-partials:
      - estilos/typst/typst-template.typ
      - estilos/typst/typst-show.typ
      - estilos/typst/page.typ
      - estilos/typst/numbering.typ
  epub:
    toc: true

editor:
  render-on-save: true
