<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650">
  <!-- Apertura del capítulo 1: el puesto, el cuaderno y el ojo. Collage brutalista. -->
  <defs>
    <pattern id="trama" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#111" opacity=".22"/>
    </pattern>
    <pattern id="toldo" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="60" height="120" fill="#e10600"/>
      <rect x="60" width="60" height="120" fill="#f2efe6"/>
    </pattern>
  </defs>
  <rect width="1600" height="650" fill="#f2efe6"/>
  <rect width="1600" height="650" fill="url(#trama)"/>

  <!-- toldo del puesto -->
  <path d="M0 0 H1600 V120 Q1560 170 1520 120 Q1480 170 1440 120 Q1400 170 1360 120 Q1320 170 1280 120 Q1240 170 1200 120 Q1160 170 1120 120 Q1080 170 1040 120 Q1000 170 960 120 Q920 170 880 120 Q840 170 800 120 Q760 170 720 120 Q680 170 640 120 Q600 170 560 120 Q520 170 480 120 Q440 170 400 120 Q360 170 320 120 Q280 170 240 120 Q200 170 160 120 Q120 170 80 120 Q40 170 0 120 Z" fill="url(#toldo)" stroke="#111" stroke-width="8"/>

  <!-- sacos -->
  <g stroke="#111" stroke-width="7" font-family="'Arial Black', Impact, sans-serif" font-size="34" text-anchor="middle">
    <g transform="translate(90 330) rotate(-3)">
      <rect x="10" y="10" width="200" height="250" fill="#111"/>
      <path d="M0 40 Q100 0 200 40 L190 250 H10 Z" fill="#f2efe6"/>
      <text x="100" y="160" fill="#111" stroke="none">ARROZ</text>
    </g>
    <g transform="translate(320 360) rotate(2)">
      <rect x="10" y="10" width="190" height="230" fill="#111"/>
      <path d="M0 40 Q95 0 190 40 L180 230 H10 Z" fill="#ffd400"/>
      <text x="95" y="150" fill="#111" stroke="none">AZÚCAR</text>
    </g>
    <g transform="translate(540 340) rotate(-1.5)">
      <rect x="10" y="10" width="190" height="250" fill="#111"/>
      <path d="M0 40 Q95 0 190 40 L180 250 H10 Z" fill="#f2efe6"/>
      <text x="95" y="160" fill="#111" stroke="none">FIDEO</text>
    </g>
  </g>

  <!-- botellas de aceite -->
  <g stroke="#111" stroke-width="6">
    <rect x="770" y="380" width="70" height="200" fill="#ffd400"/>
    <rect x="790" y="345" width="30" height="40" fill="#111"/>
    <rect x="860" y="400" width="70" height="180" fill="#ffd400"/>
    <rect x="880" y="365" width="30" height="40" fill="#111"/>
  </g>

  <!-- cuaderno azul -->
  <g transform="translate(1010 200) rotate(6)">
    <rect x="18" y="18" width="460" height="380" fill="#111"/>
    <rect width="460" height="380" fill="#0033ff" stroke="#111" stroke-width="8"/>
    <rect x="30" y="30" width="400" height="320" fill="#f2efe6" stroke="#111" stroke-width="5"/>
    <g font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="30" fill="#111">
      <text x="55" y="85">sábado:</text>
      <text x="55" y="140">arroz ......... 4</text>
      <text x="55" y="190">aceite ........ 3</text>
      <text x="55" y="240">sal ............ 6</text>
    </g>
    <path d="M330 120 l20 20 l40 -50" fill="none" stroke="#e10600" stroke-width="9"/>
    <path d="M330 170 l20 20 l40 -50" fill="none" stroke="#e10600" stroke-width="9"/>
    <text x="55" y="315" font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#e10600">SI stock &lt; mínimo → pedir</text>
  </g>

  <!-- ojo -->
  <g transform="translate(1440 520) rotate(-8)">
    <ellipse rx="120" ry="62" fill="#f2efe6" stroke="#111" stroke-width="9"/>
    <circle r="40" fill="#111"/>
    <circle cx="12" cy="-12" r="11" fill="#f2efe6"/>
  </g>

  <!-- etiqueta -->
  <g transform="translate(70 600) rotate(-1)">
    <rect width="560" height="40" fill="#111"/>
    <text x="18" y="29" font-family="'Courier New', monospace" font-weight="700" font-size="24" fill="#ffd400">PUESTO 47 · ABARROTES · DESDE 2004</text>
  </g>
</svg>
