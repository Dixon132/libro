<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <!-- 0.1 + 0.2 != 0.3: el centavo que se pierde -->
  <rect width="900" height="520" fill="#f2efe6"/>
  <g transform="rotate(-3 450 80)">
    <rect x="60" y="40" width="780" height="80" fill="#111"/>
    <text x="450" y="96" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="38" fill="#ffd400">0.1 + 0.2 = 0.30000000000000004</text>
  </g>
  <!-- monedas -->
  <g font-family="'Arial Black', Impact, sans-serif" text-anchor="middle">
    <g transform="translate(200 300)"><circle r="90" fill="#ffd400" stroke="#111" stroke-width="8"/><circle r="70" fill="none" stroke="#111" stroke-width="3"/><text y="18" font-size="46">0.10</text></g>
    <text x="330" y="318" font-size="60">+</text>
    <g transform="translate(460 300)"><circle r="90" fill="#ffd400" stroke="#111" stroke-width="8"/><circle r="70" fill="none" stroke="#111" stroke-width="3"/><text y="18" font-size="46">0.20</text></g>
    <text x="590" y="318" font-size="60">≠</text>
    <g transform="translate(730 300) rotate(12)"><circle r="90" fill="#fff" stroke="#e10600" stroke-width="8" stroke-dasharray="18 10"/><text y="18" font-size="46" fill="#e10600">0.30?</text></g>
  </g>
  <text x="450" y="470" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="24" fill="#111">el dinero de la gente se cuenta en centavos enteros</text>
</svg>
