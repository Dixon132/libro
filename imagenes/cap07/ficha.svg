<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 860" width="700" height="860">
  <!-- La ficha de pedido: anatomía de una buena especificación -->
  <rect width="700" height="860" fill="#f2efe6"/>
  <g transform="rotate(-1.5 350 430)">
    <rect x="62" y="62" width="580" height="760" fill="#111"/>
    <rect x="50" y="50" width="580" height="760" fill="#fbf8ee" stroke="#111" stroke-width="8"/>
    <rect x="50" y="50" width="580" height="90" fill="#7a00ff" stroke="#111" stroke-width="8"/>
    <text x="340" y="110" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="40" fill="#f2efe6">FICHA DE PEDIDO</text>
    <g font-family="'Courier New', monospace" font-weight="700" font-size="25" fill="#111">
      <rect x="80" y="170" width="44" height="44" fill="#ffd400" stroke="#111" stroke-width="4"/><text x="92" y="202">1</text><text x="140" y="202">CONTEXTO</text>
      <rect x="80" y="260" width="44" height="44" fill="#ffd400" stroke="#111" stroke-width="4"/><text x="92" y="292">2</text><text x="140" y="292">TAREA</text>
      <rect x="80" y="350" width="44" height="44" fill="#ffd400" stroke="#111" stroke-width="4"/><text x="92" y="382">3</text><text x="140" y="382">ENTRADAS</text>
      <rect x="80" y="440" width="44" height="44" fill="#ffd400" stroke="#111" stroke-width="4"/><text x="92" y="472">4</text><text x="140" y="472">RESTRICCIONES</text>
      <rect x="80" y="530" width="44" height="44" fill="#ffd400" stroke="#111" stroke-width="4"/><text x="92" y="562">5</text><text x="140" y="562">FORMATO</text>
      <rect x="80" y="620" width="44" height="44" fill="#ffd400" stroke="#111" stroke-width="4"/><text x="92" y="652">6</text><text x="140" y="652">EJEMPLOS</text>
      <rect x="80" y="710" width="44" height="44" fill="#e10600" stroke="#111" stroke-width="4"/><text x="92" y="742" fill="#fff">7</text><text x="140" y="742">CÓMO SÉ QUE ESTÁ BIEN</text>
    </g>
    <g stroke="#111" stroke-width="2" stroke-dasharray="4 6">
      <line x1="140" y1="228" x2="600" y2="228"/><line x1="140" y1="318" x2="600" y2="318"/>
      <line x1="140" y1="408" x2="600" y2="408"/><line x1="140" y1="498" x2="600" y2="498"/>
      <line x1="140" y1="588" x2="600" y2="588"/><line x1="140" y1="678" x2="600" y2="678"/>
    </g>
  </g>
  <!-- sello -->
  <g transform="translate(540 760) rotate(-16)" font-family="'Arial Black', Impact, sans-serif" text-anchor="middle">
    <rect x="-110" y="-38" width="220" height="70" fill="none" stroke="#e10600" stroke-width="7"/>
    <text y="12" font-size="30" fill="#e10600">0 BITS</text>
  </g>
</svg>
