<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650">
  <!-- Apertura cap. 7: Doña Rosa le dicta a la máquina; el ojo escucha. -->
  <defs>
    <pattern id="puntos" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.2" fill="#7a00ff" opacity=".25"/>
    </pattern>
  </defs>
  <rect width="1600" height="650" fill="#f2efe6"/>
  <rect width="1600" height="650" fill="url(#puntos)"/>

  <!-- globo de diálogo humano (vago) -->
  <g transform="translate(90 110) rotate(-4)">
    <rect x="12" y="12" width="560" height="200" fill="#111"/>
    <rect width="560" height="200" fill="#fff" stroke="#111" stroke-width="8"/>
    <path d="M80 200 L60 280 L170 200 Z" fill="#fff" stroke="#111" stroke-width="8"/>
    <text x="40" y="90" font-family="'Segoe Print', 'Ink Free', cursive" font-size="40" fill="#1c3f9e">"Hazme el sistema</text>
    <text x="40" y="150" font-family="'Segoe Print', 'Ink Free', cursive" font-size="40" fill="#1c3f9e">de mi puesto…"</text>
    <line x1="30" y1="60" x2="540" y2="170" stroke="#e10600" stroke-width="10"/>
  </g>

  <!-- ficha precisa -->
  <g transform="translate(150 380) rotate(3)">
    <rect x="12" y="12" width="560" height="220" fill="#7a00ff"/>
    <rect width="560" height="220" fill="#ffd400" stroke="#111" stroke-width="8"/>
    <g font-family="'Courier New', monospace" font-weight="700" font-size="26" fill="#111">
      <text x="28" y="50">TAREA: armar_pedido()</text>
      <text x="28" y="92">ENTRADA: dict productos</text>
      <text x="28" y="134">REGLA: stock &lt; minimo O…</text>
      <text x="28" y="176">PRUEBAS: 6 assert ✓</text>
    </g>
  </g>

  <!-- máquina con ojo -->
  <g transform="translate(1080 120)">
    <rect x="16" y="16" width="400" height="420" fill="#111"/>
    <rect width="400" height="420" fill="#7a00ff" stroke="#111" stroke-width="8"/>
    <path d="M60 170 Q200 60 340 170 Q200 280 60 170 Z" fill="#f2efe6" stroke="#111" stroke-width="8"/>
    <circle cx="200" cy="170" r="52" fill="#ffd400" stroke="#111" stroke-width="6"/>
    <circle cx="200" cy="170" r="22" fill="#111"/>
    <rect x="60" y="300" width="280" height="70" fill="#111"/>
    <text x="200" y="348" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="28" fill="#00a651">tokens_</text>
  </g>

  <!-- flechas -->
  <path d="M690 210 C820 170 920 220 1060 240" fill="none" stroke="#111" stroke-width="9" stroke-dasharray="20 14"/>
  <path d="M740 470 C860 470 940 400 1060 360" fill="none" stroke="#111" stroke-width="10"/>
  <path d="M1040 340 L1076 356 L1046 386 Z" fill="#111"/>
</svg>
